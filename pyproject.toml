[project]
name = "taskflow-qa-showcase"
version = "1.0.0"
description = "Production-shaped API + browser test suite wired into CI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "api: HTTP-level tests against the running service",
    "e2e: browser tests driven with Playwright",
    "security: authorization and data-isolation checks",
]
filterwarnings = ["error", "default::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults; `Depends()` and `Query()`
# in signatures is exactly how FastAPI is meant to be written.
"app/main.py" = ["B008"]
