name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests

  api:
    name: api (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run API suite
        run: pytest -m api -n auto --html=reports/api.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report-py${{ matrix.python-version }}
          path: reports/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Install browser
        run: playwright install --with-deps chromium
      - name: Run browser suite
        run: |
          pytest -m e2e \
            --browser chromium \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            --html=reports/e2e.html --self-contained-html
      - name: Upload failure evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            reports/
            test-results/
          retention-days: 7
